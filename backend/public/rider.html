<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>骑手配送台 · Quick Delivery</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f6f8; color: #1c1f23; }
  header { background: #fff; padding: 14px 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #e6e8eb; position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; margin-right: auto; }
  header input { padding: 8px 10px; border: 1px solid #dcdfe3; border-radius: 8px; font-size: 13px; width: 190px; }
  header button { padding: 8px 14px; border-radius: 8px; border: 0; background: #1c1f23; color: #fff; font-size: 13px; cursor: pointer; }
  .rider-name { font-size: 13px; color: #059669; font-weight: 600; }
  .hint { padding: 10px 20px; font-size: 12px; color: #6b7280; }
  .list { padding: 0 20px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #e6e8eb; font-size: 13px; }
  .card .oid { font-weight: 600; font-size: 14px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eff6ff; color: #1d4ed8; margin-left: 6px; }
  .badge.picked { background: #ecfdf5; color: #059669; }
  .row { margin: 8px 0; color: #374151; line-height: 1.6; }
  .label { color: #9ca3af; font-size: 11px; display: block; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button { flex: 1; padding: 10px; border: 0; border-radius: 9px; font-size: 13px; cursor: pointer; }
  .primary { background: #059669; color: #fff; }
  .dark { background: #1c1f23; color: #fff; }
  .empty { color: #9ca3af; font-size: 13px; padding: 30px 20px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1c1f23; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>骑手配送台</h1>
  <div id="loginBox" style="display:flex;gap:8px;align-items:center">
    <input id="phone" placeholder="骑手手机号，如 +15550001111" />
    <input id="password" type="password" placeholder="密码" />
    <button onclick="doLogin()">登录</button>
  </div>
  <div id="riderBox" style="display:none;gap:10px;align-items:center">
    <span class="rider-name" id="riderName"></span>
    <button onclick="reportLocation()" style="background:#059669">上报位置</button>
    <button onclick="logout()" style="background:#eef0f3;color:#374151">退出</button>
  </div>
</header>
<div class="hint" id="hint">登录后查看分配给你的订单。页面每 15 秒自动刷新。</div>
<div id="list" class="list"><div class="empty">请先登录</div></div>
<div class="toast" id="toast"></div>

<script>
const GQL = window.location.origin + '/graphql';
let riderId = '';

function token() { return localStorage.getItem('qd_rider_token') || ''; }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

async function gql(query, variables) {
  const headers = { 'Content-Type': 'application/json' };
  if (token()) headers['Authorization'] = 'Bearer ' + token();
  const res = await fetch(GQL, { method: 'POST', headers, body: JSON.stringify({ query, variables }) });
  const json = await res.json();
  if (json.errors && json.errors.length) throw new Error(json.errors[0].message);
  return json.data;
}

async function doLogin() {
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  if (!phone || !password) { toast('请输入手机号和密码'); return; }
  try {
    const d = await gql(`mutation($p:String!,$pw:String!){ riderLogin(phone:$p,password:$pw){ token userId name } }`, { p: phone, pw: password });
    localStorage.setItem('qd_rider_token', d.riderLogin.token);
    riderId = d.riderLogin.userId;
    toast('登录成功');
    await boot();
  } catch (e) {
    toast('登录失败：' + e.message);
  }
}

function logout() {
  localStorage.removeItem('qd_rider_token');
  riderId = '';
  document.getElementById('loginBox').style.display = 'flex';
  document.getElementById('riderBox').style.display = 'none';
  document.getElementById('list').innerHTML = '<div class="empty">请先登录</div>';
  document.getElementById('hint').textContent = '登录后查看分配给你的订单。';
}

async function boot() {
  if (!token()) {
    document.getElementById('loginBox').style.display = 'flex';
    document.getElementById('riderBox').style.display = 'none';
    return;
  }
  try {
    const d = await gql(`{ riderProfile { _id name phone isAvailable } }`);
    const me = d.riderProfile;
    if (!me) throw new Error('骑手账号无效');
    riderId = me._id;
    document.getElementById('riderName').textContent = me.name;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('riderBox').style.display = 'flex';
    document.getElementById('hint').textContent = `${me.name}　取餐 → 送达。每 15 秒自动刷新；上报位置需要浏览器定位权限。`;
    await load();
  } catch (e) {
    localStorage.removeItem('qd_rider_token');
    document.getElementById('loginBox').style.display = 'flex';
    document.getElementById('riderBox').style.display = 'none';
    toast('需要重新登录：' + e.message);
  }
}

async function load() {
  if (!riderId) return;
  try {
    const data = await gql(`query($r: ID!) {
      riderOrders(riderId: $r) {
        _id orderId orderStatus paidAmount paymentMethod
        deliveryAddress { label deliveryAddress details }
        items { title quantity }
      }
    }`, { r: riderId });
    render(data.riderOrders || []);
  } catch (e) {
    toast('加载失败：' + e.message);
  }
}

function render(orders) {
  const el = document.getElementById('list');
  if (!orders.length) {
    el.innerHTML = '<div class="empty">当前没有分配给你的订单</div>';
    return;
  }
  el.innerHTML = orders.map(o => {
    const picked = o.orderStatus === 'PICKED';
    const items = (o.items || []).map(i => `${i.quantity} × ${i.title}`).join('，');
    return `<div class="card">
      <div class="oid">${o.orderId || o._id}<span class="badge ${picked ? 'picked' : ''}">${picked ? '配送中' : '待取餐'}</span></div>
      <div class="row"><span class="label">送达</span>${(o.deliveryAddress && o.deliveryAddress.deliveryAddress) || ''}<br/>${(o.deliveryAddress && o.deliveryAddress.details) || ''}</div>
      <div class="row"><span class="label">菜品</span>${items}</div>
      <div class="row"><span class="label">收款</span>$${Number(o.paidAmount || 0).toFixed(2)}（${o.paymentMethod || ''}）</div>
      <div class="actions">
        ${picked
          ? `<button class="dark" onclick="act('riderDeliver','${o._id}')">已送达</button>`
          : `<button class="primary" onclick="act('riderPickUp','${o._id}')">已取餐</button>`}
      </div>
    </div>`;
  }).join('');
}

async function act(name, id) {
  try {
    await gql(`mutation($id: ID!, $riderId: ID!) { ${name}(id: $id, riderId: $riderId) { _id } }`, { id, riderId });
    toast('操作成功');
    load();
  } catch (e) {
    toast('失败：' + e.message);
  }
}

function reportLocation() {
  if (!riderId) { toast('请先登录'); return; }
  if (!navigator.geolocation) { toast('浏览器不支持定位'); return; }
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      await gql(`mutation($r: ID!, $lat: Float!, $lng: Float!) {
        updateRiderLocation(riderId: $r, latitude: $lat, longitude: $lng) { _id }
      }`, { r: riderId, lat: pos.coords.latitude, lng: pos.coords.longitude });
      toast('位置已上报');
    } catch (e) {
      toast('上报失败：' + e.message);
    }
  }, (err) => toast('定位失败：' + err.message), { enableHighAccuracy: true, timeout: 10000 });
}

boot();
setInterval(() => { if (riderId) load(); }, 15000);
</script>
</body>
</html>
